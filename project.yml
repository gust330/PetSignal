name: PetSignal
options:
  bundleIdPrefix: com.gust330
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PetSignal:
    type: application
    platform: iOS
    sources:
      - path: PetSignal
    info:
      path: PetSignal/Resources/Info.plist
      properties:
        CFBundleDisplayName: PetSignal
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gust330.PetSignal
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - PetSignalTests
  PetSignalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PetSignalTests
    dependencies:
      - target: PetSignal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gust330.PetSignalTests
